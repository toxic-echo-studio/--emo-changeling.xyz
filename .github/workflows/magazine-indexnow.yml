name: MAGAZINE IndexNow Notification

on:
  push:
    branches:
      - main
    paths:
      - 'MAGAZINE/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit changed MAGAZINE URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed_files=$(git -c core.quotepath=false diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'MAGAZINE/*.html' 'MAGAZINE/**/*.html')
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            changed_files=$(git -c core.quotepath=false diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'MAGAZINE/*.html' 'MAGAZINE/**/*.html')
          else
            changed_files=$(git -c core.quotepath=false diff-tree --no-commit-id --name-only -r --diff-filter=AM HEAD -- 'MAGAZINE/*.html' 'MAGAZINE/**/*.html')
          fi

          urls=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ "$file" = "MAGAZINE/404.html" ] && continue
            [ "$file" = "MAGAZINE/impressum.html" ] && continue

            rel="${file#MAGAZINE/}"
            if [ "$rel" = "index.html" ]; then
              path="/"
            elif [[ "$rel" == */index.html ]]; then
              path="/${rel%index.html}"
            else
              path="/${rel%.html}"
            fi

            urls+=("https://reverse.emo-changeling.xyz${path}")
          done <<< "$changed_files"

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No changed MAGAZINE URLs to submit."
            exit 0
          fi

          sleep 75

          payload=$(printf '%s\n' "${urls[@]}" | jq -R . | jq -s '{
            host: "reverse.emo-changeling.xyz",
            key: "7f3a9d2b8e1c4f5a6b0d8e2c1f9a4b3d",
            keyLocation: "https://reverse.emo-changeling.xyz/7f3a9d2b8e1c4f5a6b0d8e2c1f9a4b3d.txt",
            urlList: .
          }')

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "$payload"
