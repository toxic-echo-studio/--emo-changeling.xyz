name: GALLERY IndexNow Notification

on:
  push:
    branches:
      - main
    paths:
      - 'GALLERY/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Submit changed GALLERY URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            changed_files=$(git -c core.quotepath=false diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'GALLERY/*.html' 'GALLERY/**/*.html')
          else
            changed_files=$(git -c core.quotepath=false diff-tree --no-commit-id --name-only -r --diff-filter=AM HEAD -- 'GALLERY/*.html' 'GALLERY/**/*.html')
          fi

          urls=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [[ "$file" == *.asc ]] && continue
            [ "$file" = "GALLERY/404.html" ] && continue
            [[ "$file" == GALLERY/graphics/* ]] && continue

            rel="${file#GALLERY/}"
            if [ "$rel" = "index.html" ]; then
              path="/"
            elif [[ "$rel" == */index.html ]]; then
              path="/${rel%index.html}"
            else
              path="/${rel%.html}/"
            fi

            urls+=("https://gallery.emo-changeling.xyz${path}")
          done <<< "$changed_files"

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No changed GALLERY URLs to submit."
            exit 0
          fi

          sleep 75

          payload=$(printf '%s\n' "${urls[@]}" | jq -R . | jq -s '{
            host: "gallery.emo-changeling.xyz",
            key: "7f3a9d2b8e1c4f5a6b0d8e2c1f9a4b3d",
            keyLocation: "https://gallery.emo-changeling.xyz/7f3a9d2b8e1c4f5a6b0d8e2c1f9a4b3d.txt",
            urlList: .
          }')

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "$payload"
